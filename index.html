<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NBA Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="wrap">
      <span class="brand">NBA Tracker</span>
      <a href="#teams">Teams</a>
      <a href="#scores">Scores</a>
      <a href="#ratings">My Ratings</a>
    </div>
  </nav>

  <main class="wrap">
    <!-- Teams -->
    <section id="teams">
      <div class="head">
        <h1>Teams</h1>
        <div class="controls">
          <select id="team">
            <option value="1">Atlanta Hawks</option>
            <option value="2">Boston Celtics</option>
            <option value="17">Brooklyn Nets</option>
            <option value="30">Charlotte Hornets</option>
            <option value="4">Chicago Bulls</option>
            <option value="5">Cleveland Cavaliers</option>
            <option value="6">Dallas Mavericks</option>
            <option value="7">Denver Nuggets</option>
            <option value="8">Detroit Pistons</option>
            <option value="9">Golden State Warriors</option>
            <option value="10">Houston Rockets</option>
            <option value="11">Indiana Pacers</option>
            <option value="12">LA Clippers</option>
            <option value="13">Los Angeles Lakers</option>
            <option value="29">Memphis Grizzlies</option>
            <option value="14">Miami Heat</option>
            <option value="15">Milwaukee Bucks</option>
            <option value="16">Minnesota Timberwolves</option>
            <option value="3">New Orleans Pelicans</option>
            <option value="18">New York Knicks</option>
            <option value="25">Oklahoma City Thunder</option>
            <option value="19">Orlando Magic</option>
            <option value="20" selected>Philadelphia 76ers</option>
            <option value="21">Phoenix Suns</option>
            <option value="22">Portland Trail Blazers</option>
            <option value="23">Sacramento Kings</option>
            <option value="24">San Antonio Spurs</option>
            <option value="28">Toronto Raptors</option>
            <option value="26">Utah Jazz</option>
            <option value="27">Washington Wizards</option>
          </select>
          <button id="rosterButton">Roster</button>
          <button id="scheduleButton" class="outline">Schedule</button>
        </div>
      </div>

      <div class="banner"><h2 id="teamName"></h2></div>
      <div id="teamContent" class="card"></div>
      <div id="player" class="card player"></div>
    </section>

    <!-- Scores -->
    <section id="scores">
      <div class="head">
        <h1>Scores</h1>
        <div class="controls">
          <input id="date" type="date">
          <button id="gamesButton">Show</button>
        </div>
      </div>
      <div id="games" class="grid"></div>
    </section>

    <!-- My Ratings -->
    <section id="ratings">
      <div class="head">
        <h1>My Ratings</h1>
      </div>
      <div class="card">
        <p id="pickedGame" class="muted">Click "Rate this game" on any game above.</p>
        <div class="controls">
          <select id="stars">
            <option value="5">5 stars</option>
            <option value="4">4 stars</option>
            <option value="3">3 stars</option>
            <option value="2">2 stars</option>
            <option value="1">1 star</option>
          </select>
          <input id="review" class="wide" placeholder="How was the game? (optional)">
          <button id="rateButton">Save rating</button>
        </div>
      </div>
      <div id="ratingsList"></div>
    </section>
  </main>

  <footer>NBA data from ESPN. Ratings are saved in this browser.</footer>

  <script src="app.js"></script>
</body>
</html>
